org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# KSP incremental processing dropped the Hilt ViewModel modules of unchanged classes in debug builds (the app then crashed at
# startup with NoSuchMethodException: <ViewModel>.<init> []): generate everything on every run.
ksp.incremental=false
ksp.incremental.intermodule=false
