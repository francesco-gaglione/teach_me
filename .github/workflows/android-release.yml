# Builds the signed release APK and checks its signature. Manual only: it never runs on pull requests,
# so a fork can neither trigger it nor reach the secrets. The secrets it needs are listed in android/README.md
# ("Release signing in CI"): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: android-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # A fork has no secrets of the owner; this also stops a copy of the workflow from failing in a confusing way.
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # The secrets are read only by the steps that need them, through env: never interpolated into a script,
      # never printed. GitHub masks their values in the logs.
      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing (see android/README.md, Release signing in CI)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          TEACHME_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          TEACHME_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TEACHME_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TEACHME_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify the signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          # An unsigned build is named app-release-unsigned.apk: its absence is already a failure.
          test -f "$apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: teach_me-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
