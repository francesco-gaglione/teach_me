# Checks (fmt, clippy, tests). Deployment is manual: backend/README.md, deploy.sh.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # Without debug info and incremental data the test binaries are much smaller: with them the
    # runner ran out of space while linking (ld "Bus error") on pull requests.
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain (and rustfmt, clippy) pinned in backend/rust-toolchain.toml
      - run: rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # Same pinned, hash-checked PDFium as the Docker image. TEACH_ME_REQUIRE_PDFIUM
      # makes the PDF tests fail, not skip, if the library is not found.
      - run: scripts/fetch-pdfium.sh "$RUNNER_TEMP/pdfium"
      - run: cargo test --all
        env:
          TEACH_ME_PDFIUM_DIR: ${{ runner.temp }}/pdfium/lib
          TEACH_ME_REQUIRE_PDFIUM: '1'

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      # The runner image ships the Android SDK with its licences accepted; missing
      # platforms are downloaded by the Android Gradle plugin.
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: ./gradlew ktlintCheck lint testDebugUnitTest assembleDebug
