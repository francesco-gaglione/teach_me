# Weekly update PRs for dependencies (threat model, "Dipendenze"). Security advisories
# open PRs at any time; version bumps are grouped to keep the noise low.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /backend
    schedule: { interval: weekly }
    groups:
      cargo: { patterns: ["*"] }
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: weekly }
    groups:
      gradle: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    ignore:
      # From v6 the caching part of gradle/actions is proprietary and needs accepting
      # Gradle's Terms of Use; v5 is MIT and already runs on Node 24.
      - dependency-name: gradle/actions
        versions: [">=6"]
  - package-ecosystem: docker
    directories: [/backend, /backend/deploy/tts]
    schedule: { interval: weekly }
