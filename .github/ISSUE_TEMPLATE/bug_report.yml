name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a topic about ...
        2. Open the lesson ...
        3. ...
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend
        - Android app
        - Generated lessons (content quality)
        - Deployment
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit or release you are running.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove API keys, passwords and tokens before pasting.
      render: text
